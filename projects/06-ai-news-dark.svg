<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="ConsolasFallback,Consolas,'JetBrains Mono','DejaVu Sans Mono',monospace" width="985px" height="460px" font-size="16px">
<title>AI News — AI automation</title>
<style>
.k {fill: #ffa657;}
.v {fill: #a5d6ff;}
.m {fill: #616e7f;}
.t {fill: #c9d1d9; font-weight: 700;}
.x {fill: #c9d1d9;}
.s {fill: #3fb950;}
.l {fill: #a5d6ff; text-decoration: underline;}
text, tspan {white-space: pre; font-variant-ligatures: none;}
</style>
<defs><clipPath id="lg"><rect x="24" y="24" width="88" height="88" rx="20"/></clipPath></defs>
<rect width="985px" height="460px" fill="#161b22" rx="15"/>
<image x="24" y="24" width="88" height="88" clip-path="url(#lg)" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
<rect x="24.5" y="24.5" width="87" height="87" rx="19.5" fill="none" stroke="#30363d"/>
<text x="132" y="34" fill="#c9d1d9" xml:space="preserve">
<tspan x="132" y="34"><tspan class="m">- </tspan><tspan class="t">06  AI News</tspan> <tspan class="m">——————————————————————————————————————————————————————</tspan> <tspan class="k">AI automation</tspan></tspan>
<tspan x="132" y="54"></tspan>
<tspan x="132" y="74"><tspan class="m">. </tspan><tspan class="k">About</tspan>:<tspan class="m"> .... </tspan><tspan class="x">A self-running Telegram channel about AI news, with an AI model</tspan></tspan>
<tspan x="132" y="94">              <tspan class="x">finding, verifying and writing every post.</tspan></tspan>
<tspan x="132" y="114"></tspan>
<tspan x="132" y="134"><tspan class="m">. </tspan><tspan class="k">Task</tspan>:<tspan class="m"> ..... </tspan><tspan class="v">Run a news channel with no human editor: find fresh stories, check</tspan></tspan>
<tspan x="132" y="154">              <tspan class="v">them against the primary source, avoid repeats and publish on</tspan></tspan>
<tspan x="132" y="174">              <tspan class="v">schedule.</tspan></tspan>
<tspan x="132" y="194"></tspan>
<tspan x="132" y="214"><tspan class="m">. </tspan><tspan class="k">Solution</tspan>:<tspan class="m"> . </tspan><tspan class="v">An AI model acts as the editor: web search, article reading, X and</tspan></tspan>
<tspan x="132" y="234">              <tspan class="v">Threads posts and strict structured output. The model is swappable</tspan></tspan>
<tspan x="132" y="254">              <tspan class="v">(Claude, GPT, Gemini). Several post formats and rubrics, Playwright</tspan></tspan>
<tspan x="132" y="274">              <tspan class="v">source screenshots, videos and albums.</tspan></tspan>
<tspan x="132" y="294"></tspan>
<tspan x="132" y="314"><tspan class="m">. </tspan><tspan class="k">Result</tspan>:<tspan class="m"> ... </tspan><tspan class="v">8 posts a day with no human involvement. Runs in Docker, with dry-run</tspan></tspan>
<tspan x="132" y="334">              <tspan class="v">mode, manual publishing and failure alerts to the admin.</tspan></tspan>
<tspan x="132" y="354"></tspan>
<tspan x="132" y="374"><tspan class="m">. </tspan><tspan class="k">Stack</tspan>:<tspan class="m"> .... </tspan><tspan class="s">Python · LLM API · Claude / GPT / Gemini · Tool use · Web search ·</tspan></tspan>
<tspan x="132" y="394">              <tspan class="s">Playwright · Telegram Bot API · Docker</tspan></tspan>
<tspan x="132" y="414"></tspan>
<tspan x="132" y="434"><tspan class="m">. </tspan><tspan class="k">Link</tspan>:<tspan class="m"> ..... </tspan><tspan class="l">t.me/A1News_world</tspan></tspan>
</text>
</svg>
