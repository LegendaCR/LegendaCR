<text x="132" y="34" fill="#c9d1d9" xml:space="preserve">
<tspan x="132" y="34"><tspan class="m">- </tspan><tspan class="t">03  Attract Platform</tspan> <tspan class="m">—————————————————————————————————————————————</tspan> <tspan class="k">Telegram SaaS</tspan></tspan>
<tspan x="132" y="54"><tspan class="m">. </tspan><tspan class="k">About</tspan>:<tspan class="m"> .... </tspan><tspan class="x">A commercial platform for monetising channels through paid</tspan></tspan>
<tspan x="132" y="74">              <tspan class="x">subscriptions.</tspan></tspan>
<tspan x="132" y="94"><tspan class="m">. </tspan><tspan class="k">Task</tspan>:<tspan class="m"> ..... </tspan><tspan class="v">Bring plan management, payments and subscriber access into one product</tspan></tspan>
<tspan x="132" y="114">              <tspan class="v">for channel administrators.</tspan></tspan>
<tspan x="132" y="134"><tspan class="m">. </tspan><tspan class="k">Solution</tspan>:<tspan class="m"> . </tspan><tspan class="v">An admin SaaS bot, dedicated gatekeeper bots, billing, access</tspan></tspan>
<tspan x="132" y="154">              <tspan class="v">provisioning, automatic removal and service notifications.</tspan></tspan>
<tspan x="132" y="174"><tspan class="m">. </tspan><tspan class="k">Result</tspan>:<tspan class="m"> ... </tspan><tspan class="v">A production stack backed by PostgreSQL, Docker, nginx and Cloudflare</tspan></tspan>
<tspan x="132" y="194">              <tspan class="v">Tunnel.</tspan></tspan>
<tspan x="132" y="214"><tspan class="m">. </tspan><tspan class="k">Stack</tspan>:<tspan class="m"> .... </tspan><tspan class="s">Node.js · Express · PostgreSQL · Telegram Bot API · Docker · nginx ·</tspan></tspan>
<tspan x="132" y="234">              <tspan class="s">Cloudflare Tunnel</tspan></tspan>
<tspan x="132" y="254"><tspan class="m">. </tspan><tspan class="k">Link</tspan>:<tspan class="m"> ..... </tspan><tspan class="l">t.me/attractsub_bot</tspan></tspan>
</text>
