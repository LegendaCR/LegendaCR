<tspan x="132" y="34"><tspan class="m">- </tspan><tspan class="t">08  Legend Defense Bot</tspan> <tspan class="m">——————————————————————————————————————————</tspan> <tspan class="k">Moderation bot</tspan></tspan>
<tspan x="132" y="54"><tspan class="m">. </tspan><tspan class="k">About</tspan>:<tspan class="m"> .... </tspan><tspan class="x">An anti-spam system for Telegram groups and channels.</tspan></tspan>
<tspan x="132" y="74"><tspan class="m">. </tspan><tspan class="k">Task</tspan>:<tspan class="m"> ..... </tspan><tspan class="v">Block links, banned terms and obfuscated spelling without constant</tspan></tspan>
<tspan x="132" y="94">              <tspan class="v">manual moderation.</tspan></tspan>
<tspan x="132" y="114"><tspan class="m">. </tspan><tspan class="k">Solution</tspan>:<tspan class="m"> . </tspan><tspan class="v">Text normalisation, configurable dictionaries, fuzzy matching and</tspan></tspan>
<tspan x="132" y="134">              <tspan class="v">moderator controls inside Telegram.</tspan></tspan>
<tspan x="132" y="154"><tspan class="m">. </tspan><tspan class="k">Result</tspan>:<tspan class="m"> ... </tspan><tspan class="v">Automated filtering for complex spam patterns with in-chat</tspan></tspan>
<tspan x="132" y="174">              <tspan class="v">administration.</tspan></tspan>
<tspan x="132" y="194"><tspan class="m">. </tspan><tspan class="k">Stack</tspan>:<tspan class="m"> .... </tspan><tspan class="s">Node.js · Telegram Bot API · JSON · Normalization · Fuzzy matching</tspan></tspan>
<tspan x="132" y="214"><tspan class="m">. </tspan><tspan class="k">Link</tspan>:<tspan class="m"> ..... </tspan><tspan class="l">t.me/Legend_defense_bot</tspan></tspan>
