name: Update profile card

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 06:00 MSK
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render dark_mode.svg / light_mode.svg
        env:
          # CARD_TOKEN (optional PAT) also counts private repos; falls back to public data
          GH_TOKEN: ${{ secrets.CARD_TOKEN || secrets.GITHUB_TOKEN }}
          TZ: Europe/Moscow   # uptime counts days in local time
        run: python3 scripts/card.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg projects_dark.svg projects_light.svg scripts/stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
